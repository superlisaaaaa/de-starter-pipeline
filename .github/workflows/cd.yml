# ============================================================================
# CD = Continuous Delivery / Deployment
# Runs when code lands on main (after a PR is merged), on a daily schedule,
# or by hand. Its job: "Run the pipeline for real and publish the result."
#
# In a company this would load data into Snowflake / Databricks / BigQuery.
# Here we:
#   1. run the full pipeline,
#   2. save the warehouse file as a downloadable artifact,
#   3. publish the dbt documentation website to GitHub Pages.
# ============================================================================
name: CD

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"     # every day at 05:17 UTC (like an Airflow / Databricks job schedule)
  workflow_dispatch:

# Only one deployment at a time; a newer run waits for the older one
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  run-pipeline:
    name: Run pipeline
    runs-on: ubuntu-latest
    env:
      DUCKDB_PATH: ${{ github.workspace }}/warehouse.duckdb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Extract + load (bronze)
        run: python -m pipeline.extract_load

      - name: Build + test models (silver, gold)
        working-directory: dbt_project
        run: dbt build --profiles-dir .

      - name: Generate documentation site
        working-directory: dbt_project
        run: |
          dbt docs generate --static --profiles-dir .
          mkdir -p ../site
          cp target/static_index.html ../site/index.html

      - name: Save the warehouse as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: warehouse
          path: warehouse.duckdb
          retention-days: 7

      - name: Package the docs site for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-docs:
    name: Publish docs to GitHub Pages
    needs: run-pipeline
    runs-on: ubuntu-latest
    permissions:
      pages: write        # allowed to publish to Pages
      id-token: write     # proves to Pages that this workflow is who it says it is
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
